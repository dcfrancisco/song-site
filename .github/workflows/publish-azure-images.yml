name: Publish Azure Container Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-images-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run frontend tests
        run: npm run test:ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Run Docker deployment-path smoke test
        run: |
          docker compose up --build -d
          npm run test:docker

      - name: Stop local Docker stack
        if: always()
        run: docker compose down -v

      - name: Validate required Azure and MSAL configuration
        env:
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
          VITE_AZURE_REDIRECT_URI: ${{ secrets.VITE_AZURE_REDIRECT_URI }}
          VITE_ENTRA_CLIENT_ID: ${{ secrets.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ secrets.VITE_ENTRA_TENANT_ID }}
        run: |
          set -euo pipefail
          for name in AZURE_ACR_NAME AZURE_ACR_LOGIN_SERVER VITE_AZURE_REDIRECT_URI VITE_ENTRA_CLIENT_ID VITE_ENTRA_TENANT_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub configuration: ${name}" >&2
              exit 1
            fi
          done

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate Docker to ACR
        env:
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
        run: az acr login --name "$AZURE_ACR_NAME"

      - name: Build and push commit-tagged images
        env:
          ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
          VITE_AZURE_REDIRECT_URI: ${{ secrets.VITE_AZURE_REDIRECT_URI }}
          VITE_ENTRA_CLIENT_ID: ${{ secrets.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ secrets.VITE_ENTRA_TENANT_ID }}
        run: |
          set -euo pipefail
          WEB_IMAGE="${ACR_LOGIN_SERVER}/song-site-web:${GITHUB_SHA}"
          API_IMAGE="${ACR_LOGIN_SERVER}/song-site-api:${GITHUB_SHA}"

          docker build \
            --build-arg VITE_AZURE_REDIRECT_URI="$VITE_AZURE_REDIRECT_URI" \
            --build-arg VITE_ENTRA_CLIENT_ID="$VITE_ENTRA_CLIENT_ID" \
            --build-arg VITE_ENTRA_TENANT_ID="$VITE_ENTRA_TENANT_ID" \
            -f docker/frontend.Dockerfile \
            -t "$WEB_IMAGE" .

          docker build \
            -f docker/backend.Dockerfile \
            -t "$API_IMAGE" .

          docker push "$WEB_IMAGE"
          docker push "$API_IMAGE"

          echo "Published $WEB_IMAGE"
          echo "Published $API_IMAGE"
