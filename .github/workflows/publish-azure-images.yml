name: Publish Azure Container Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-images-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run frontend tests
        run: npm run test:ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Run Docker deployment-path smoke test
        run: |
          docker compose up --build -d
          npm run test:docker

      - name: Stop local Docker stack
        if: always()
        run: docker compose down -v

      - name: Validate required shared preview deployment configuration
        env:
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          PGHOST: ${{ vars.PGHOST }}
          PGPORT: ${{ vars.PGPORT }}
          PGDATABASE: ${{ vars.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGSSL: ${{ vars.PGSSL }}
          VITE_AZURE_REDIRECT_URI: ${{ secrets.VITE_AZURE_REDIRECT_URI }}
          VITE_ENTRA_CLIENT_ID: ${{ secrets.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ secrets.VITE_ENTRA_TENANT_ID }}
        run: |
          set -euo pipefail
          for name in AZURE_ACR_NAME AZURE_ACR_LOGIN_SERVER AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD PGSSL VITE_AZURE_REDIRECT_URI VITE_ENTRA_CLIENT_ID VITE_ENTRA_TENANT_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required shared preview GitHub configuration: ${name}" >&2
              exit 1
            fi
          done

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve existing shared preview Container Apps
        id: container-app-targets
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          WEB_APP_NAME: ca-song-site-web-dev
          API_APP_NAME: ca-song-site-api-dev
        run: |
          set -euo pipefail

          if ! apps_json="$(az containerapp list \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --query "[?name=='${WEB_APP_NAME}' || name=='${API_APP_NAME}'].{name:name,resourceGroup:resourceGroup}" \
            --output json)"; then
            echo "Could not list Container Apps. The Azure OIDC identity needs permission to read the existing preview apps." >&2
            exit 1
          fi

          web_count="$(jq --arg name "$WEB_APP_NAME" '[.[] | select(.name == $name)] | length' <<< "$apps_json")"
          api_count="$(jq --arg name "$API_APP_NAME" '[.[] | select(.name == $name)] | length' <<< "$apps_json")"
          if [[ "$web_count" != "1" || "$api_count" != "1" ]]; then
            echo "Expected exactly one existing preview Container App named ${WEB_APP_NAME} and ${API_APP_NAME}; found ${web_count} and ${api_count}." >&2
            exit 1
          fi

          web_resource_group="$(jq -r --arg name "$WEB_APP_NAME" '.[] | select(.name == $name) | .resourceGroup' <<< "$apps_json")"
          api_resource_group="$(jq -r --arg name "$API_APP_NAME" '.[] | select(.name == $name) | .resourceGroup' <<< "$apps_json")"
          if [[ "$web_resource_group" != "$api_resource_group" ]]; then
            echo "The existing preview frontend and API are not in the same resource group." >&2
            exit 1
          fi

          echo "resource-group=$web_resource_group" >> "$GITHUB_OUTPUT"
          echo "web-app=$WEB_APP_NAME" >> "$GITHUB_OUTPUT"
          echo "api-app=$API_APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Authenticate Docker to ACR
        env:
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
        run: az acr login --name "$AZURE_ACR_NAME"

      - name: Build and push commit-tagged images
        env:
          ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
          VITE_AZURE_REDIRECT_URI: ${{ secrets.VITE_AZURE_REDIRECT_URI }}
          VITE_ENTRA_CLIENT_ID: ${{ secrets.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ secrets.VITE_ENTRA_TENANT_ID }}
        run: |
          set -euo pipefail
          WEB_IMAGE="${ACR_LOGIN_SERVER}/song-site-web:${GITHUB_SHA}"
          API_IMAGE="${ACR_LOGIN_SERVER}/song-site-api:${GITHUB_SHA}"

          docker build \
            --build-arg VITE_AZURE_REDIRECT_URI="$VITE_AZURE_REDIRECT_URI" \
            --build-arg VITE_ENTRA_CLIENT_ID="$VITE_ENTRA_CLIENT_ID" \
            --build-arg VITE_ENTRA_TENANT_ID="$VITE_ENTRA_TENANT_ID" \
            -f docker/frontend.Dockerfile \
            -t "$WEB_IMAGE" .

          docker build \
            -f docker/backend.Dockerfile \
            -t "$API_IMAGE" .

          docker push "$WEB_IMAGE"
          docker push "$API_IMAGE"

          echo "Published $WEB_IMAGE"
          echo "Published $API_IMAGE"

      - name: Apply PostgreSQL migrations
        working-directory: backend
        env:
          PGHOST: ${{ vars.PGHOST }}
          PGPORT: ${{ vars.PGPORT }}
          PGDATABASE: ${{ vars.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGSSL: ${{ vars.PGSSL }}
        run: npm run db:postgres:migrate

      - name: Deploy images to Container Apps
        env:
          RESOURCE_GROUP: ${{ steps.container-app-targets.outputs.resource-group }}
          WEB_APP: ${{ steps.container-app-targets.outputs.web-app }}
          API_APP: ${{ steps.container-app-targets.outputs.api-app }}
          ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
        run: |
          set -euo pipefail
          az containerapp update -g "$RESOURCE_GROUP" -n "$API_APP" --image "${ACR_LOGIN_SERVER}/song-site-api:${GITHUB_SHA}"
          az containerapp update -g "$RESOURCE_GROUP" -n "$WEB_APP" --image "${ACR_LOGIN_SERVER}/song-site-web:${GITHUB_SHA}"
