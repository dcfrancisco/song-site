openapi: 3.0.3
info:
  title: Song Site API
  version: 0.1.0
  description: OpenAPI-first contract for sign-in-only portal access. All portal data APIs require a server-authenticated session; the session status endpoint is public and returns no portal data. Production Entra verification is not yet implemented.
servers:
  - url: http://localhost:5001
    description: Local backend
security:
  - developmentSession: []
paths:
  /api/v1/session:
    get:
      operationId: getSession
      summary: Get effective access mode and identity summary
      security: []
      responses:
        '200':
          description: Session summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionSummary' }
  /api/v1/dev/session:
    post:
      operationId: startDevelopmentSession
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [fixture], properties: { fixture: { type: string, enum: [developer, author, publisher, administrator] } } } } }
      responses: { '200': { description: Local session created }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      operationId: endDevelopmentSession
      security: []
      responses: { '204': { description: Local session ended } }
  /api/v1/auth/login:
    post:
      operationId: loginWithPassword
      summary: Sign in with a local email and password (no SSO)
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string, maxLength: 255 }, password: { type: string, maxLength: 128 } } } } }
      responses: { '200': { description: Session created, content: { application/json: { schema: { $ref: '#/components/schemas/SessionSummary' } } } }, '401': { description: Invalid email or password }, '404': { $ref: '#/components/responses/NotFound' }, '429': { description: Too many failed attempts } }
  /api/v1/auth/change-password:
    post:
      operationId: changePassword
      summary: Change the signed-in user's password
      security: [{ developmentSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [currentPassword, newPassword], properties: { currentPassword: { type: string, maxLength: 128 }, newPassword: { type: string, minLength: 12, maxLength: 128 } } } } }
      responses: { '204': { description: Password changed }, '400': { description: Invalid new password }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/dashboard/summary:
    get:
      operationId: getDashboardSummary
      summary: Get server-derived authorized dashboard summary
      responses:
        '200': { description: Summary filtered by the effective principal, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/rbac/users:
    post:
      operationId: createLocalUser
      summary: Create a local user who signs in with a password
      security: [{ developmentSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email, displayName, password], properties: { email: { type: string, maxLength: 255 }, displayName: { type: string, maxLength: 255 }, password: { type: string, minLength: 12, maxLength: 128 }, roles: { type: array, items: { type: string } } } } } }
      responses: { '201': { description: User created, content: { application/json: { schema: { $ref: '#/components/schemas/RbacUser' } } } }, '400': { description: Invalid request }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { description: Email already in use } }
    get:
      operationId: listRbacUsers
      summary: List users and assigned roles
      security: [{ developmentSession: [] }]
      responses:
        '200':
          description: Users visible to administrators
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RbacUser' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/rbac/users/{userId}/roles:
    put:
      operationId: replaceUserRoles
      summary: Replace a user's roles
      security: [{ developmentSession: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RbacRoleAssignment' } } }
      responses:
        '200': { description: Updated effective principal, content: { application/json: { schema: { $ref: '#/components/schemas/RbacPrincipal' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/users/{userId}:
    put:
      operationId: updateUserProfile
      summary: Update a user's profile or active status without changing roles
      security: [{ developmentSession: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UserProfileUpdate' } } }
      responses:
        '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/RbacUser' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/content/pages/{pageKey}:
    get:
      operationId: getPublishedPageContent
      summary: Get published page content
      parameters:
        - { name: pageKey, in: path, required: true, schema: { type: string, enum: [announcement-page] } }
      responses:
        '200':
          description: Published page version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentVersion' }
  /api/v1/authoring/pages/{pageKey}/draft:
    get:
      operationId: getPageDraft
      security: [{ developmentSession: [] }]
      parameters:
        - { name: pageKey, in: path, required: true, schema: { type: string, enum: [announcement-page] } }
      responses: { '200': { description: Draft or null } }
    put:
      operationId: savePageDraft
      security: [{ developmentSession: [] }]
      parameters:
        - { name: pageKey, in: path, required: true, schema: { type: string, enum: [announcement-page] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                expectedVersion: { type: integer }
                payload: { $ref: '#/components/schemas/AnnouncementPage' }
      responses: { '200': { description: Draft saved }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
    delete:
      operationId: discardPageDraft
      security: [{ developmentSession: [] }]
      parameters:
        - { name: pageKey, in: path, required: true, schema: { type: string, enum: [announcement-page] } }
      responses: { '200': { description: Draft discarded } }
  /api/v1/authoring/pages/{pageKey}/preview:
    post:
      operationId: previewPage
      security: [{ developmentSession: [] }]
      parameters: [{ name: pageKey, in: path, required: true, schema: { type: string, enum: [announcement-page] } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [payload], properties: { payload: { $ref: '#/components/schemas/AnnouncementPage' } } } } }
      responses: { '200': { description: Validated preview }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/authoring/pages/{pageKey}/publish:
    post:
      operationId: publishPage
      security: [{ developmentSession: [] }]
      parameters: [{ name: pageKey, in: path, required: true, schema: { type: string, enum: [announcement-page] } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [expectedVersion], properties: { expectedVersion: { type: integer } } } } }
      responses: { '200': { description: Published version }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/authoring/pages/{pageKey}/versions:
    get:
      operationId: listPageVersions
      security: [{ developmentSession: [] }]
      parameters: [{ name: pageKey, in: path, required: true, schema: { type: string, enum: [announcement-page] } }]
      responses: { '200': { description: Version history } }
  /api/v1/authoring/pages/{pageKey}/versions/{versionId}/restore:
    post:
      operationId: restorePageVersion
      security: [{ developmentSession: [] }]
      parameters:
        - { name: pageKey, in: path, required: true, schema: { type: string, enum: [announcement-page] } }
        - { name: versionId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [expectedVersion], properties: { expectedVersion: { type: integer } } } } }
      responses: { '200': { description: New restored draft }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/tasks:
    get:
      operationId: listJourneyTasks
      summary: List Journey tasks
      responses:
        '200':
          description: Journey tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      operationId: createJourneyTask
      summary: Create a Journey task
      security:
        - developmentSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '201':
          description: Created task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /api/tasks/{id}:
    put:
      operationId: updateJourneyTask
      summary: Update a Journey task
      security:
        - developmentSession: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tasks/{id}/status:
    put:
      operationId: updateJourneyTaskStatus
      summary: Transition a Journey task status
      security:
        - developmentSession: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusAction'
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/progress-status:
    get:
      operationId: getJourneyProgress
      summary: Get Journey progress
      responses:
        '200':
          description: Journey progress percentage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progress'
  /api/training-tasks:
    get:
      operationId: listTrainingTasks
      summary: List training tasks
      responses:
        '200':
          description: Training tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      operationId: createTrainingTask
      summary: Create a training task
      security:
        - developmentSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '201':
          description: Created task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /api/training-tasks/{id}:
    put:
      operationId: updateTrainingTask
      summary: Update a training task
      security:
        - developmentSession: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Updated training task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/training-tasks/{id}/status:
    put:
      operationId: updateTrainingTaskStatus
      summary: Transition a training task status
      security:
        - developmentSession: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusAction'
      responses:
        '200':
          description: Updated training task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/training-progress-status:
    get:
      operationId: getTrainingProgress
      summary: Get training progress
      responses:
        '200':
          description: Training progress percentage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progress'
  /api/leadership:
    get:
      operationId: getLeadership
      summary: Get leadership content
      responses:
        '200':
          description: Leadership content grouped by section
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: object
  /api/journey/items:
    get:
      operationId: listJourneyItems
      summary: List Journey items
      deprecated: true
      description: Compatibility endpoint for the retired legacy Journey UI. Use /api/tasks for the canonical Journey resource.
      responses:
        '200':
          description: Journey items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JourneyItem'
  /api/journey/items/{id}:
    put:
      operationId: updateJourneyItem
      summary: Temporarily update a Journey item
      deprecated: true
      description: Compatibility endpoint for the retired legacy Journey UI. Use /api/tasks/{id}/status for canonical task transitions.
      security:
        - developmentSession: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Updated Journey item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyItem'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/leadership/{section}/{id}:
    put:
      operationId: updateLeadershipItem
      summary: Temporarily update a leadership item
      security:
        - developmentSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200': { description: Updated leadership item }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/home/spotlight:
    get:
      operationId: getHomeSpotlight
      summary: Get home spotlight content
      responses:
        '200':
          description: Home spotlight
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeSpotlight'
    put:
      operationId: updateHomeSpotlight
      summary: Temporarily update home spotlight content
      security:
        - developmentSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeSpotlight'
      responses:
        '200': { description: Updated home spotlight }
  /api/home/announcements:
    get:
      operationId: getHomeAnnouncements
      summary: Get home announcements
      responses:
        '200':
          description: Home announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Announcement'
  /api/home/announcements/{id}:
    put:
      operationId: updateAnnouncement
      summary: Temporarily update a home announcement
      security:
        - developmentSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Announcement'
      responses:
        '200': { description: Updated announcement }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/song-links:
    get:
      operationId: getSongLinks
      summary: Get grouped Song links
      responses:
        '200':
          description: Grouped Song links
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [title, cards]
                  properties:
                    title: { type: string }
                    cards:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
  /api/song-links/{sectionId}/{cardId}:
    put:
      operationId: updateSongLink
      summary: Temporarily update a Song Link card
      security:
        - developmentSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200': { description: Updated Song Link card }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    developmentSession:
      type: apiKey
      in: cookie
      name: song_site_dev_session
      description: Local-only HttpOnly session for the implemented Development Mode. Production Entra verification remains unimplemented.
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    Unauthorized:
      description: Authentication required
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Permission or CSRF check failed
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Optimistic concurrency conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationError:
      description: Content validation failed
      content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    DashboardSummary:
      type: object
      properties:
        identity: { nullable: true, type: object, properties: { displayName: { type: string }, email: { type: string }, role: { nullable: true, type: string }, mode: { type: string } } }
        cards: { type: array, items: { type: object, required: [key, label, value, detail], properties: { key: { type: string }, label: { type: string }, value: { oneOf: [{ type: integer }, { type: string }] }, detail: { type: string } } } }
        charts: { type: array, items: { type: object, required: [key, title, segments], properties: { key: { type: string }, title: { type: string }, segments: { type: array, items: { type: object, required: [label, value], properties: { label: { type: string }, value: { type: integer } } } } } } }
        upNext:
          type: object
          description: Next open Journey and Training tasks, in-progress first
          properties:
            journey: { type: array, items: { $ref: '#/components/schemas/DashboardTask' } }
            training: { type: array, items: { $ref: '#/components/schemas/DashboardTask' } }
        recentCompletions: { type: array, items: { type: object, properties: { kind: { type: string, enum: [Journey, Training] }, title: { type: string }, completedAt: { type: string } } } }
        roleBreakdown: { type: array, description: Only with rbac:users:read, items: { type: object, properties: { role: { type: string }, users: { type: integer } } } }
        accountStatus: { type: object, description: Only with rbac:users:read, properties: { active: { type: integer }, inactive: { type: integer } } }
        recentActivity: { type: array, description: Only with rbac:users:read, items: { type: object, properties: { action: { type: string }, actor: { type: string }, target: { type: string, nullable: true }, at: { type: string } } } }
    DashboardTask:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        status: { type: string }
        endDate: { type: string }
    UserProfileUpdate:
      type: object
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        isActive: { type: boolean }
    Task:
      type: object
      required: [id, title, status, progress]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        startDate: { type: string }
        endDate: { type: string }
        status:
          type: string
          enum: [Not Started, Pending, In Progress, Completed]
        progress: { type: number, minimum: 0, maximum: 100 }
        url: { type: string }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        actualDuration: { type: integer, minimum: 0, nullable: true }
        description: { type: string }
        externalLinks:
          type: array
          items:
            type: object
            required: [text, url]
            properties:
              text: { type: string }
              url: { type: string, format: uri }
    JourneyItem:
      type: object
      required: [id, label, route, text, status]
      properties:
        id: { type: integer, format: int64 }
        label: { type: string }
        route: { type: string }
        text: { type: string }
        image: { type: string }
        status: { type: string }
        startDate: { type: string }
        endDate: { type: string }
        lastUpdated: { type: string }
        isExpanded: { type: boolean }
    TaskUpdate:
      type: object
      additionalProperties: true
    StatusAction:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [start, complete]
    Progress:
      type: object
      required: [progress]
      properties:
        progress: { type: integer, minimum: 0, maximum: 100 }
    HomeSpotlight:
      type: object
      required: [title, persons]
      properties:
        title: { type: string }
        persons:
          type: array
          items:
            type: object
            additionalProperties: true
    Announcement:
      type: object
      required: [id, icon, title, body]
      properties:
        id: { type: integer }
        icon: { type: string }
        title: { type: string }
        body: { type: string }
    SessionSummary:
      type: object
      required: [mode, authenticated]
      properties:
        mode: { type: string, enum: [guest, development, entra] }
        authenticated: { type: boolean }
        identity: { type: object, nullable: true }
        csrfToken: { type: string }
    RbacUser:
      type: object
      required: [id, email, displayName, provider, subject, isActive, roles]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        provider: { type: string }
        subject: { type: string }
        isActive: { type: boolean }
        roles: { type: array, items: { type: string } }
    RbacRoleAssignment:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          maxItems: 16
          items: { type: string, minLength: 1, maxLength: 64 }
    RbacPrincipal:
      type: object
      required: [provider, subject, permissions, isActive]
      properties:
        provider: { type: string }
        subject: { type: string }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
        isActive: { type: boolean }
    AnnouncementPage:
      type: object
      additionalProperties: false
      required: [schemaVersion, hero, carousel, trainings, notices, reminder]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        hero: { type: object, required: [title, body], properties: { title: { type: string }, body: { type: string } } }
        carousel: { type: array, items: { type: object, required: [id, name, image, body], properties: { id: { type: string }, name: { type: string }, image: { type: string }, body: { type: string }, order: { type: integer } } } }
        trainings: { type: array, items: { type: object, required: [id, title, description, link, linkLabel], properties: { id: { type: string }, title: { type: string }, description: { type: string }, link: { type: string, format: uri-reference }, linkLabel: { type: string }, order: { type: integer } } } }
        notices: { type: array, items: { type: object, required: [id, title, body], properties: { id: { type: string }, title: { type: string }, body: { type: string }, order: { type: integer } } } }
        reminder: { type: object, required: [title, body], properties: { title: { type: string }, body: { type: string } } }
    ContentVersion:
      type: object
      required: [id, version, state, payload]
      properties:
        id: { type: integer }
        version: { type: integer }
        state: { type: string, enum: [draft, published, superseded, discarded] }
        payload: { $ref: '#/components/schemas/AnnouncementPage' }
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties: { errors: { type: array, items: { type: string } } }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
