services:
  postgres:
    image: pgvector/pgvector:pg14
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-song_site}
      POSTGRES_USER: ${POSTGRES_USER:-song_site}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-song_site_local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - song_site_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./backend/migrations-postgres:/opt/song-site-migrations:ro

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-5001}
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-song_site}:${POSTGRES_PASSWORD:-song_site_local}@postgres:5432/${POSTGRES_DB:-song_site}
      PGSSL: ${PGSSL:-false}
      TEMP_CONTENT_API_KEY: ${TEMP_CONTENT_API_KEY:-compose-local-content-key}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "${BACKEND_PORT:-5001}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 5001) + '/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NGINX_API_TARGET: backend:5001
        NGINX_API_SCHEME: http
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  song_site_pgdata:
