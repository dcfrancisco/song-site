<main class="landing-shell">
  <section class="landing-card">
    <div class="eyebrow">SONG SITE ACCESS</div>
    <h1>Welcome to Song Site</h1>
    <p class="lede">
      Sign in to access the Song Site portal.
    </p>

    @if (error()) {
      <div class="status-banner error">{{ error() }}</div>
    }

    <div class="actions">
      <button class="primary-action" type="button" [disabled]="isBusy()" (click)="signIn()">
        {{ isBusy() ? 'Signing in...' : 'Sign in with Microsoft SSO' }}
      </button>
    </div>

    <section class="email-sign-in" aria-labelledby="email-sign-in-title">
      <h2 id="email-sign-in-title">Sign in with email</h2>
      @if (emailError()) {
        <div class="status-banner error" role="alert">{{ emailError() }}</div>
      }
      <form (submit)="$event.preventDefault(); signInWithPassword(emailInput.value, passwordInput.value)">
        <label for="email-address">Email address</label>
        <input #emailInput id="email-address" type="email" autocomplete="username" placeholder="you@example.com" required>
        <label for="password">Password</label>
        <input #passwordInput id="password" type="password" autocomplete="current-password" required>
        <button class="primary-action" type="submit" [disabled]="emailBusy()">
          {{ emailBusy() ? 'Signing in...' : 'Sign in' }}
        </button>
      </form>
    </section>
  </section>
</main>
